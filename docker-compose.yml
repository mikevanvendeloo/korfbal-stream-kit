services:
  db:
    image: postgres:16-alpine
    networks:
      - korfbal-network
    environment:
      TZ: Europe/Amsterdam
      POSTGRES_USER: korfbal
      POSTGRES_PASSWORD: korfbal
      POSTGRES_DB: korfbal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korfbal -d korfbal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eénmalige migratie/seed job. Draait bij 'up' en stopt na succes.
  migrate-streamz:
    # Gebruik dezelfde image als de API. In CI/CD vervang door jouw registry:tag
    build:
      context: .
      dockerfile: apps/korfbal-stream-api/Dockerfile
    networks:
      - korfbal-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      DATABASE_URL: postgresql://korfbal:korfbal@db:5432/korfbal?schema=public
    # Hardened runtime-image heeft geen shell: migratie + seed via een node-script.
    command: ["node", "/app/seed/migrate-and-seed.cjs"]
    restart: "no"

  korfbal-streamz-api:
    build:
      context: .
      dockerfile: apps/korfbal-stream-api/Dockerfile
    networks:
      - korfbal-network
    # Lokale secrets (MATCH_SCHEDULE_API_TOKEN), niet ingecheckt; zie secrets.env.example.
    env_file:
      - path: secrets.env
        required: false
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      DATABASE_URL: "postgresql://korfbal:korfbal@db:5432/korfbal?schema=public"
      MATCH_SCHEDULE_BASE_URL: "https://api.sportclubvrijwilligersmanagement.nl/v1"
      PORT: 3333
      ASSETS_DIR: /app/storage
      UPLOADS_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate-streamz:
        condition: service_completed_successfully
    ports:
      - "3333:3333"
    volumes:
      - ./storage:/app/storage
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 5
  korfbal-streamz-kit:
    build:
      context: .
      dockerfile: apps/korfbal-stream-kit/Dockerfile
    networks:
      - korfbal-network
    ports:
      - "80:8080" # Host poort 80 -> container poort 8080 (hardened nginx draait als non-root)
    environment:
      TZ: Europe/Amsterdam
    depends_on:
      - korfbal-streamz-api # Wacht tot de API (waarmee het praat) online is

  pgadmin:
    image: dpage/pgadmin4
    container_name: korfbal-pgadmin
    networks:
      - korfbal-network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@korfbal.nl
      PGADMIN_DEFAULT_PASSWORD: korfbal
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:

networks:
  korfbal-network:
    driver: bridge
