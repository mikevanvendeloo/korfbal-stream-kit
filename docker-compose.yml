# De hele app lokaal in Docker, gebouwd uit je eigen code. Eigen projectnaam en database-volume: staat los van
# de dev-database voor npm run dev en de tests (docker-compose-db.yml) en van localtest.
#
#   Starten:            docker compose up -d --build
#                       Altijd met --build: de migrate-job draait de migraties die in het image zitten. Zonder
#                       --build krijg je het image van de vorige keer, zonder nieuwe migraties.
#   Migraties nakijken: docker compose logs migrate-streamz
#   Stoppen:            docker compose down        (database blijft staan)
#   Opnieuw beginnen:   docker compose down -v     (wist de database van deze stack; de seed vult hem weer)
#
# App: http://localhost   API: http://localhost:3333   Postgres: localhost:5434   pgAdmin: http://localhost:5050
# Gebruikt dezelfde poorten 80 en 5050 als localtest: draai ze nooit tegelijk. Poort 3333 is ook die van
# npm run api:dev. Geeft `up` "port is already allocated", kijk dan met `docker ps` wat de poort al heeft.
name: korfbal-dev

services:
  db:
    image: postgres:16-alpine
    networks:
      - korfbal-network
    environment:
      TZ: Europe/Amsterdam
      POSTGRES_USER: korfbal
      POSTGRES_PASSWORD: korfbal
      POSTGRES_DB: korfbal
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korfbal -d korfbal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eénmalige migratie/seed job. Draait bij 'up' en stopt na succes.
  migrate-streamz:
    build:
      context: .
      dockerfile: apps/korfbal-stream-api/Dockerfile
    # Eén image voor migrate en API, zodat ze altijd dezelfde code en migraties hebben
    image: korfbal-stream-api:dev
    networks:
      - korfbal-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      DATABASE_URL: postgresql://korfbal:korfbal@db:5432/korfbal?schema=public
      # SKIP_SEED=true docker compose up -d: alleen migreren, bijv. op een database uit een backup
      SKIP_SEED: ${SKIP_SEED:-false}
    # Hardened runtime-image heeft geen shell: migratie + seed via een node-script.
    command: ["node", "/app/seed/migrate-and-seed.cjs"]
    restart: "no"

  # De servicenaam moet korfbal-streamz-api blijven: nginx.conf proxyt daarnaartoe.
  korfbal-streamz-api:
    image: korfbal-stream-api:dev
    networks:
      - korfbal-network
    # Lokale secrets (optioneel), niet ingecheckt; zie secrets.env.example.
    env_file:
      - path: secrets.env
        required: false
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      DATABASE_URL: "postgresql://korfbal:korfbal@db:5432/korfbal?schema=public"
      PORT: 3333
      ASSETS_DIR: /app/storage
      UPLOADS_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate-streamz:
        condition: service_completed_successfully
    ports:
      - "3333:3333"
    volumes:
      - ./storage:/app/storage
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 5

  korfbal-streamz-kit:
    build:
      context: .
      dockerfile: apps/korfbal-stream-kit/Dockerfile
    image: korfbal-stream-kit:dev
    networks:
      - korfbal-network
    ports:
      - "80:8080" # Host poort 80 -> container poort 8080 (hardened nginx draait als non-root)
    environment:
      TZ: Europe/Amsterdam
    depends_on:
      - korfbal-streamz-api # Wacht tot de API (waarmee het praat) online is

  pgadmin:
    image: dpage/pgadmin4
    container_name: korfbal-pgadmin
    networks:
      - korfbal-network
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@korfbal.nl
      PGADMIN_DEFAULT_PASSWORD: korfbal
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:

networks:
  korfbal-network:
    driver: bridge
