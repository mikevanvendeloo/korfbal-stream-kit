# De venue-bridge in de zaal: de image van Docker Hub in een vaste versie. Een eigen project (venue-bridge), los
# van Streamz: de bridge belt zelf naar de API, in de cloud of op een pc in de zaal.
#
#   Windows: start.cmd / upgrade.cmd (RUN_BRIDGE=true, instellingen in streamz.local.env)
#   Anders:  docker compose --env-file streamz.local.env -f docker-compose.venue-bridge.yml \
#                -f variants/<variant>.yml up -d venue-bridge
#            (of scripts/venue-bridge-start.sh <variant> met PROD=1)
#
# API_URL: het adres van Streamz, zonder /api. Draait de API op dezelfde pc (Docker Desktop):
# http://host.docker.internal:3333; anders http://<ip>:3333 of https://<domein>.
#
# Alles over de zaal (adressen, statistiekeninstellingen, vMix-pc's) stel je in de Kit in bij Beheer > Instellingen >
# Venue. De varianten (variants/) bepalen waar /stats vandaan komt; ./data/venue-bridge (naast dit bestand) bewaart
# de ontvangen configuratie en de lokale kopie van de database.
name: venue-bridge

services:
  venue-bridge:
    image: mvanvendeloo/streamz-kit-venue-bridge:${STREAMZ_BRIDGE_VERSION:-latest}
    restart: unless-stopped
    networks:
      - korfbal-network
    # Alle instellingen van de bridge staan in een env-bestand naast dit bestand: standaard streamz.local.env (niet
    # ingecheckt, voorbeeld: streamz.local.env.example), een ander met BRIDGE_ENV_FILE=<pad>. API_URL, API_KEY,
    # BRIDGE_NAME, BRIDGE_PAGE_URL en LOG_LEVEL. Zonder dat bestand start de bridge niet.
    env_file:
      - path: ${BRIDGE_ENV_FILE:-streamz.local.env}
        required: true
    # Vast, niet in te stellen
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      PORT: 3340
      STATS_DIR: /stats
      COPY_DIR: /data
    volumes:
      # De opgeslagen configuratie en de lokale kopie van de database
      - ./data/venue-bridge:/data
    # Op het netwerk van de zaal (niet alleen localhost): de pagina en de reserve-API
    ports:
      - "3340:3340"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3340/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

# Het eigen netwerk van dit project (venue-bridge_korfbal-network)
networks:
  korfbal-network:
    driver: bridge
