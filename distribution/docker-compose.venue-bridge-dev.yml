# De venue-bridge naast de dev-omgeving (docker-compose-dev.yml of docker-compose-localtest.yml): een bridge op
# korfbal-network die zich met de dev-API verbindt, zoals de bridge in een zaal dat met de echte API doet.
#
#   1. Maak in de Kit bij Beheer > Organisatie-instellingen > API-sleutels een sleutel "venue-bridge dev".
#   2. Zet hem in een env-bestand dat niet wordt ingecheckt: localtest.local.env (voorbeeld: localtest.local.env.example)
#      of een eigen bestand, bijvoorbeeld venue-bridge.env, met API_URL, API_KEY, BRIDGE_NAME, BRIDGE_PAGE_URL, LOG_LEVEL.
#   3. (in distribution/) BRIDGE_ENV_FILE=venue-bridge.env docker compose --env-file venue-bridge.env -f docker-compose-dev.yml \
#        -f docker-compose.venue-bridge-dev.yml \
#        -f variants/<variant>.yml up -d --build venue-bridge
#      (of scripts/venue-bridge-start.sh <variant>; localtest: start-localtest.sh, met localtest.local.env)
#
# Alle instellingen van de zaal (adressen van scorebord, schotklok en vMix, de statistiekeninstellingen) staan in
# de Kit bij Beheer > Instellingen > Venue; de bridge krijgt ze van de API en bewaart ze in /data.
#
# STANDAARD (zonder variant): de opgeslagen pagina local-html/tweede-scherm.html staat in /stats. Vul bij
# Instellingen > Venue > Statistieken als pagina `tweede-scherm.html` in en zet "Database gebruiken" uit. Zo werkt de
# bridge zonder statistiek-pc. Voor de echte bron kies je één variant (variants/):
#   mac.yml              de share staat gemount op de Mac (/Volumes/KL2627)
#   windows-robocopy.yml een map die op Windows door robocopy wordt gevuld (sync-stats.ps1)
#   cifs.yml             de container mount de share zelf (start niet als de pc uit staat)
#   page-only.yml        geen share: alleen een http(s)-adres als pagina
#
# De map data/venue-bridge in de root van de repo (de opgeslagen configuratie en de kopie van de database) moet van uid 1000 zijn:
#   (in de root) mkdir -p data/venue-bridge && sudo chown -R 1000:1000 data/venue-bridge   (Docker Desktop: niet nodig)
services:
  venue-bridge:
    build:
      context: ..
      dockerfile: apps/venue-bridge/Dockerfile
    image: streamz-kit-venue-bridge:dev
    restart: unless-stopped
    networks:
      - korfbal-network
    # Alle instellingen van de bridge staan in een env-bestand naast dit bestand: standaard localtest.local.env
    # (voorbeeld: localtest.local.env.example), een ander met BRIDGE_ENV_FILE=<pad>. API_URL, API_KEY, BRIDGE_NAME,
    # BRIDGE_PAGE_URL en LOG_LEVEL. Zonder dat bestand start de bridge niet.
    env_file:
      - path: ${BRIDGE_ENV_FILE:-localtest.local.env}
        required: true
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      PORT: 3340
      # Een lege API_URL in het env-bestand: de dev-API op korfbal-network (de servicenaam in docker-compose-dev.yml)
      API_URL: ${API_URL:-http://korfbal-streamz-api:3333}
      STATS_DIR: /stats
      COPY_DIR: /data
    volumes:
      - ../data/venue-bridge:/data
      # Standaard de map met de opgeslagen pagina; een variant mount hier de echte share
      - ${VENUE_BRIDGE_PAGES_DIR:-./local-html}:/stats:ro
    # Op het netwerk van de zaal: de pagina en de reserve-API zijn bereikbaar op http://<bridge>:3340
    ports:
      - "3340:3340"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3340/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
