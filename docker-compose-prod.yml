# Productie: de images van Docker Hub in een vaste versie (de release-tag, bijv. 2026.10.14), geen latest.
# Een release bouwt alleen de apps die veranderd zijn, dus API en kit hebben elk hun eigen versie: neem per app
# de laatste tag die op Docker Hub bestaat. De migrate-job draait altijd dezelfde versie als de API.
#
#   Starten met de versies hieronder:  docker compose -f docker-compose-prod.yml up -d
#   Andere versie (upgrade/terug):     STREAMZ_API_VERSION=2026.10.15 STREAMZ_KIT_VERSION=2026.10.15 docker compose -f docker-compose-prod.yml up -d
#   Blijvend upgraden: pas de standaardversies in de image-regels aan en commit.
#   Bestaat een tag?                   docker manifest inspect mvanvendeloo/korfbal-stream-api:2026.10.15
#
# Bij een upgrade draait de migrate-job eerst de nieuwe migraties; controleren: docker compose -f docker-compose-prod.yml logs migrate-streamz
# Terug naar een oudere versie draait geen migraties terug: maak eerst een backup.
# Docker keeps the console log of a container in a file; without a limit it grows until the disk is full
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  streamz-db:
    image: postgres:16-alpine
    networks:
      - korfbal-network
    # Secrets (POSTGRES_PASSWORD, DATABASE_URL, HOST_IP) staan lokaal in
    # secrets.prod.env (niet ingecheckt), zie secrets.prod.env.example.
    env_file: secrets.prod.env
    environment:
      TZ: Europe/Amsterdam
      POSTGRES_USER: fortuna
      POSTGRES_DB: streamz
    ports:
      - "5432:5432"
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortuna -d streamz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eénmalige migratie/seed job. Draait bij 'up' en stopt na succes.
  migrate-streamz:
    # Dezelfde image (en versie) als de API
    image: mvanvendeloo/korfbal-stream-api:${STREAMZ_API_VERSION:-2026.10.13}
    networks:
      - korfbal-network
    depends_on:
      streamz-db:
        condition: service_healthy
    # Secrets (POSTGRES_PASSWORD, DATABASE_URL, HOST_IP) staan lokaal in
    # secrets.prod.env (niet ingecheckt), zie secrets.prod.env.example.
    env_file: secrets.prod.env
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
    # Hardened runtime-image heeft geen shell: migratie + seed via een node-script.
    command: ["node", "/app/seed/migrate-and-seed.cjs"]
    restart: "no"

  korfbal-streamz-api:
    image: mvanvendeloo/korfbal-stream-api:${STREAMZ_API_VERSION:-2026.10.13}
    logging: *logging
    networks:
      - korfbal-network
    # Secrets (POSTGRES_PASSWORD, DATABASE_URL, HOST_IP) staan lokaal in
    # secrets.prod.env (niet ingecheckt), zie secrets.prod.env.example.
    env_file: secrets.prod.env
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      PORT: 3333
      # true: also log every successful GET (vMix, scoreboard) and what the vMix data sources return
      DEBUG_LOGGING: ${DEBUG_LOGGING:-false}
      ASSETS_DIR: /app/storage
      UPLOADS_DIR: /app/uploads
    depends_on:
      streamz-db:
        condition: service_healthy
      migrate-streamz:
        condition: service_completed_successfully
    ports:
      - "3333:3333"
    volumes:
      - ./storage:/app/storage
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  korfbal-streamz-kit:
    image: mvanvendeloo/korfbal-stream-kit:${STREAMZ_KIT_VERSION:-2026.10.14}
    logging: *logging
    networks:
      - korfbal-network
    ports:
      - "80:8080" # Host poort 80 -> container poort 8080 (hardened nginx draait als non-root)
#    volumes:
#      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Voeg deze regel toe
    environment:
      TZ: Europe/Amsterdam
    depends_on:
      - korfbal-streamz-api # Wacht tot de API (waarmee het praat) online is

volumes:
  pgdata:

networks:
  korfbal-network:
    driver: bridge
