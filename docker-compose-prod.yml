services:
  streamz-db:
    image: postgres:16-alpine
    networks:
      - korfbal-network
    # Secrets (POSTGRES_PASSWORD, DATABASE_URL, MATCH_SCHEDULE_API_TOKEN, HOST_IP) staan lokaal in
    # secrets.prod.env (niet ingecheckt), zie secrets.prod.env.example.
    env_file: secrets.prod.env
    environment:
      TZ: Europe/Amsterdam
      POSTGRES_USER: fortuna
      POSTGRES_DB: streamz
    ports:
      - "5432:5432"
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortuna -d streamz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eénmalige migratie/seed job. Draait bij 'up' en stopt na succes.
  migrate-streamz:
    # Gebruik dezelfde image als de API. In CI/CD vervang door jouw registry:tag
    image: mvanvendeloo/korfbal-stream-api:latest
    networks:
      - korfbal-network
    depends_on:
      streamz-db:
        condition: service_healthy
    # Secrets (POSTGRES_PASSWORD, DATABASE_URL, MATCH_SCHEDULE_API_TOKEN, HOST_IP) staan lokaal in
    # secrets.prod.env (niet ingecheckt), zie secrets.prod.env.example.
    env_file: secrets.prod.env
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
    # Hardened runtime-image heeft geen shell: migratie + seed via een node-script.
    command: ["node", "/app/seed/migrate-and-seed.cjs"]
    restart: "no"

  korfbal-streamz-api:
    image: mvanvendeloo/korfbal-stream-api:latest
    networks:
      - korfbal-network
    # Secrets (POSTGRES_PASSWORD, DATABASE_URL, MATCH_SCHEDULE_API_TOKEN, HOST_IP) staan lokaal in
    # secrets.prod.env (niet ingecheckt), zie secrets.prod.env.example.
    env_file: secrets.prod.env
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      MATCH_SCHEDULE_BASE_URL: "https://api.sportclubvrijwilligersmanagement.nl/v1"
      PORT: 3333
      ASSETS_DIR: /app/storage
      UPLOADS_DIR: /app/uploads
    depends_on:
      streamz-db:
        condition: service_healthy
      migrate-streamz:
        condition: service_completed_successfully
    ports:
      - "3333:3333"
    volumes:
      - ./storage:/app/storage
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  korfbal-streamz-kit:
    image: mvanvendeloo/korfbal-stream-kit:latest
    networks:
      - korfbal-network
    ports:
      - "80:8080" # Host poort 80 -> container poort 8080 (hardened nginx draait als non-root)
#    volumes:
#      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # Voeg deze regel toe
    environment:
      TZ: Europe/Amsterdam
    depends_on:
      - korfbal-streamz-api # Wacht tot de API (waarmee het praat) online is

volumes:
  pgdata:

networks:
  korfbal-network:
    driver: bridge
