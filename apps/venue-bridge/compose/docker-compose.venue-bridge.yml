# De venue-bridge naast de dev-omgeving (docker-compose.yml of docker-compose-localtest.yml): een bridge op
# korfbal-network die zich met de dev-API verbindt, zoals de bridge in een zaal dat met de echte API doet.
#
#   1. Maak in de Kit bij Beheer > Organisatie-instellingen > API-sleutels een sleutel "venue-bridge dev".
#   2. Zet hem in een env-file die niet wordt ingecheckt, bijvoorbeeld venue-bridge.env:
#        API_KEY=<de sleutel>
#        BRIDGE_NAME=dev
#   3. docker compose --env-file venue-bridge.env -f docker-compose.yml \
#        -f apps/venue-bridge/compose/docker-compose.venue-bridge.yml \
#        -f apps/venue-bridge/compose/variants/<variant>.yml up -d --build venue-bridge
#      (of scripts/venue-bridge/start.sh <variant>; localtest: -f docker-compose-localtest.yml in plaats van docker-compose.yml)
#
# Alle instellingen van de zaal (adressen van scorebord, schotklok en vMix, de statistiekeninstellingen) staan in
# de Kit bij Beheer > Instellingen > Venue; de bridge krijgt ze van de API en bewaart ze in /data.
#
# STANDAARD (zonder variant): de opgeslagen pagina compose/local-html/tweede-scherm.html staat in /stats. Vul bij
# Instellingen > Venue > Statistieken als pagina `tweede-scherm.html` in en zet "Database gebruiken" uit. Zo werkt de
# bridge zonder statistiek-pc. Voor de echte bron kies je één variant (variants/):
#   mac.yml              de share staat gemount op de Mac (/Volumes/KL2627)
#   windows-robocopy.yml een map die op Windows door robocopy wordt gevuld (sync-stats.ps1)
#   cifs.yml             de container mount de share zelf (start niet als de pc uit staat)
#   page-only.yml        geen share: alleen een http(s)-adres als pagina
#
# De map ./data/venue-bridge (de opgeslagen configuratie en de kopie van de database) moet van uid 1000 zijn:
#   mkdir -p data/venue-bridge && sudo chown -R 1000:1000 data/venue-bridge   (Docker Desktop: niet nodig)
services:
  venue-bridge:
    build:
      context: .
      dockerfile: apps/venue-bridge/Dockerfile
    image: streamz-kit-venue-bridge:dev
    restart: unless-stopped
    networks:
      - korfbal-network
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      PORT: 3340
      # De dev-API op korfbal-network (de servicenaam in docker-compose.yml)
      API_URL: ${API_URL:-http://korfbal-streamz-api:3333}
      API_KEY: ${API_KEY:?Zet API_KEY (een API-sleutel van de organisatie) in de omgeving of een env-file}
      BRIDGE_NAME: ${BRIDGE_NAME:-venue-bridge-dev}
      # Het adres van de pagina van de bridge op het netwerk van de zaal; de Kit toont er een link naar
      BRIDGE_PAGE_URL: ${BRIDGE_PAGE_URL:-http://localhost:3340}
      STATS_DIR: /stats
      COPY_DIR: /data
      # debug: elke stap bij het lezen van de statistieken (opnieuw gelezen, ongewijzigd, overgeslagen, kopie)
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data/venue-bridge:/data
      # Standaard de map met de opgeslagen pagina; een variant mount hier de echte share
      - ${VENUE_BRIDGE_PAGES_DIR:-./apps/venue-bridge/compose/local-html}:/stats:ro
    # Op het netwerk van de zaal: de pagina en de reserve-API zijn bereikbaar op http://<bridge>:3340
    ports:
      - "3340:3340"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3340/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
