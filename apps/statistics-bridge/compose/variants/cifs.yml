# PAGE_URL: zonder eigen waarde geldt de opgeslagen pagina uit compose/local-html, die niet op de share staat. Zet PAGE_URL=http://10.12.0.63/... voor de echte pagina.
# CIFS: de container mount de share zelf als Docker-volume.
# LET OP: bestaat de pc niet (uit, andere kamer), dan kan Docker het volume niet aanmaken en start de bridge
# niet. Dat is hier juist bedoeld: alleen de bridge valt om, de rest van Streamz draait door.
# Gebruikersnaam en wachtwoord: gast zonder wachtwoord; anders in een lokale, niet ingecheckte env-file.
services:
  statistics-bridge:
    environment:
      STATS_DIR: /stats
      MDB_ENABLED: "true"
    volumes:
      - stats-share:/stats:ro

volumes:
  stats-share:
    driver: local
    driver_opts:
      type: cifs
      device: ${STATS_CIFS_DEVICE:-//10.12.0.63/KL2627}
      o: "${STATS_CIFS_OPTIONS:-username=guest,password=,vers=2.1,uid=1000,gid=1000,ro,file_mode=0444,dir_mode=0555,soft,echo_interval=5}"
