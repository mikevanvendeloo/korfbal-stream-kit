# De statistics bridge naast de bestaande omgeving (dev of localtest): een tijdelijke, losse app die de
# statistiek-pc uitleest. Bij een storing van de pc of de share valt alleen de bridge om; de Streamz Kit
# toont dan "De statistics bridge is offline".
#
#   docker compose -f docker-compose.yml -f apps/statistics-bridge/compose/docker-compose.statistics-bridge.yml \
#       -f apps/statistics-bridge/compose/variants/<variant>.yml up -d --build statistics-bridge
#   (localtest: -f docker-compose-localtest.yml in plaats van docker-compose.yml)
#
# STANDAARD (zonder variant): de opgeslagen pagina compose/local-html/tweede-scherm.html (gedownload
# 'Tweede Scherm klassiek', stand 10-8) en geen database (MDB_ENABLED=false). Zo werkt de bridge meteen, zonder
# statistiek-pc. Een andere opgeslagen pagina: vervang dat bestand, of zet STATS_BRIDGE_PAGES_DIR / PAGE_URL.
#
# Kies één variant voor de echte bron van de statistieken (variants/):
#   mac.yml              de share staat gemount op de Mac (/Volumes/KL2627)
#   windows-robocopy.yml een map die op Windows door robocopy wordt gevuld (sync-stats.ps1)
#   cifs.yml             de container mount de share zelf (start niet als de pc uit staat)
#   page-only.yml        alleen de HTML-pagina, geen database en geen share
#
# De Streamz API bereikt de bridge op http://statistics-bridge:3340 (Beheer > Instellingen > Statistieken).
# De lokale kopie van de database staat in ./data/statistics-bridge: die map moet van uid 1000 zijn
#   mkdir -p data/statistics-bridge && sudo chown -R 1000:1000 data/statistics-bridge   (Docker Desktop: niet nodig)
services:
  statistics-bridge:
    build:
      context: .
      dockerfile: apps/statistics-bridge/Dockerfile
    image: statistics-bridge:dev
    restart: unless-stopped
    networks:
      - korfbal-network
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      PORT: 3340
      # Optioneel gedeeld geheim: dan vraagt elke route behalve /health de header X-Bridge-Token.
      # Vul hetzelfde token in bij Instellingen > Statistieken > Bridge-token.
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      # De "Tweede Scherm klassiek"-pagina: een http(s)-adres, of een relatief .html-pad in STATS_DIR (standaard het
      # opgeslagen bestand uit compose/local-html)
      PAGE_URL: ${PAGE_URL:-tweede-scherm.html}
      STATS_DIR: /stats
      # Standaard geen database: alleen de pagina. De varianten mac, windows-robocopy en cifs zetten dit aan.
      MDB_ENABLED: ${MDB_ENABLED:-false}
      # De statistiek-pc voor de SMB-poortcontrole; leeg: het adres uit PAGE_URL
      SHARE_HOST: ${SHARE_HOST:-}
      # Pad van WEDSTRIJDEN.mdb binnen STATS_DIR; {team} wordt het teamnummer van de actieve productie
      MDB_PATH: ${MDB_PATH:-F{team}/WEDSTRIJDEN.mdb}
      KEEP_COPY: ${KEEP_COPY:-true}
      COPY_DIR: /data
    volumes:
      - ./data/statistics-bridge:/data
      # Standaard de map met de opgeslagen pagina; een variant mount hier de echte share
      - ${STATS_BRIDGE_PAGES_DIR:-./apps/statistics-bridge/compose/local-html}:/stats:ro
    # Alleen voor testen vanaf de host (curl http://localhost:3340/health); de Kit en vMix gaan via de Streamz API
    ports:
      - "127.0.0.1:3340:3340"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3340/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
