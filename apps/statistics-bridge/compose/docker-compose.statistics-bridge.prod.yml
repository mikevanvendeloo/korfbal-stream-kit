# De statistics bridge naast docker-compose-prod.yml: de image van Docker Hub in een vaste versie.
#
#   STREAMZ_BRIDGE_VERSION=2026.11.1 docker compose -f docker-compose-prod.yml \
#       -f apps/statistics-bridge/compose/docker-compose.statistics-bridge.prod.yml \
#       -f apps/statistics-bridge/compose/variants/<variant>.yml up -d statistics-bridge
#
# De bridge is tijdelijk en optioneel: zonder deze bestanden werkt de rest van Streamz gewoon. Zie
# docker-compose.statistics-bridge.yml voor de varianten, de omgevingsvariabelen en de ./data-map.
services:
  statistics-bridge:
    image: mvanvendeloo/statistics-bridge:${STREAMZ_BRIDGE_VERSION:-latest}
    restart: unless-stopped
    networks:
      - korfbal-network
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      PORT: 3340
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      PAGE_URL: ${PAGE_URL:-}
      SHARE_HOST: ${SHARE_HOST:-}
      MDB_PATH: ${MDB_PATH:-F{team}/WEDSTRIJDEN.mdb}
      KEEP_COPY: ${KEEP_COPY:-true}
      COPY_DIR: /data
    volumes:
      - ./data/statistics-bridge:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3340/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
