# Hoofdconfig voor de hardened nginx-image (dhi.io/nginx), die als non-root draait.
# De server-configuratie zelf staat in nginx.conf (-> /etc/nginx/conf.d/default.conf).
worker_processes auto;
# /var/run is niet schrijfbaar voor de non-root nginx-user (uid 65532) in de hardened image
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
