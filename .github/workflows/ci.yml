name: CI & Publish

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Custom Docker tag (optional; defaults to yyyy-mm-<branch>-nn)'
        required: false
        type: string
      skip_ci_checks:
        description: 'Skip CI checks (lint, test, typecheck)'
        required: false
        type: boolean
        default: false

# Workload Identity Federation for the Anthropic API (AI release notes). Not secrets -
# they only identify the federation rule; the GitHub OIDC token is the credential.
# The SDK exchanges ANTHROPIC_IDENTITY_TOKEN for a short-lived access token.
env:
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_012qG62fm1N1C3HwGuAnGBxN
  ANTHROPIC_ORGANIZATION_ID: fe21c84c-124f-436b-b4fb-06e6c829f7a4
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01EKysMoY7N4pk1zP24TZhNL
  ANTHROPIC_WORKSPACE_ID: wrkspc_01UNAAN2mqSkjkz1kPRfqC7f

jobs:
  ci-checks:
    name: Lint, Test & Typecheck
    runs-on: ubuntu-latest
    # Skip CI checks if manually triggered with skip flag
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_ci_checks
    # Define an output for this job
    outputs:
      affected_apps_json: ${{ steps.get_affected.outputs.affected_apps_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Fetch all history and tags for Nx affected
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Determine Nx SHAs
        # This action is vital. It sets $NX_BASE and $NX_HEAD env vars
        uses: nrwl/nx-set-shas@v5

      - name: Generate Prisma Client
        run: pnpm prisma:generate # Use pnpm to run scripts

      - name: Run scripts tests
        run: pnpm run scripts:test

      - name: Run CI checks for affected projects
        env:
          REQUIRE_DB: 'false'
        run: npx nx affected -t test --parallel=3 --base=$NX_BASE --head=$NX_HEAD #  ADD later lint,typecheck,

      # Install jq using the apt-get package manager
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # This step now sets an output variable for the job
      - name: Get Affected Projects & Format for Docker
        id: get_affected
        run: |
          # 1. Use the modern Nx command to get affected 'app' project names as a JSON array.
          AFFECTED_OUTPUT=$(npx nx show projects --affected --type=app --base=$NX_BASE --head=$NX_HEAD --json)
          # 2. Use 'jq' to map the original name to a sanitized version.
          SANITIZED_APPS_JSON=$(echo "$AFFECTED_OUTPUT" | jq -c '
            map({
              original: .,
              sanitized: .
                # **ALGEMEEN GEMAAKT:** Verwijdert elke @scope-naam/ prefix aan het begin van de string.
                | sub("^@[^/]+/|@"; "")
                | sub("/"; "-")
            })
          ')
          echo "Sanitized Affected Apps JSON: $SANITIZED_APPS_JSON"
          # 3. Set the new, object-based JSON list as a step output
          echo "affected_apps_json=$SANITIZED_APPS_JSON" >> "$GITHUB_OUTPUT"
  db-tests:
    name: Integration & E2E tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_ci_checks
    # The separate test database from apps/korfbal-stream-api/.env.test (korfbal_stream_test);
    # the tests refuse any database whose name doesn't end in _test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: korfbal
          POSTGRES_PASSWORD: korfbal
          POSTGRES_DB: korfbal_stream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U korfbal -d korfbal_stream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      # Migrates the test database itself (global setup)
      - name: Run API integration tests
        run: pnpm run api:test:integration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Starts its own API (port 3335) and dev server (port 4300) on the test database
      - name: Run e2e tests
        run: pnpm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dist/.playwright/apps/korfbal-stream-kit-e2e/
            apps/korfbal-stream-kit-e2e/test-output/
          if-no-files-found: ignore
          retention-days: 7

  preview-release-notes:
    name: Preview Release Notes
    runs-on: ubuntu-latest
    # Only meaningful on PRs - previews what the release notes would look like
    # if this PR's changes were released, without creating an actual release.
    # Fork PRs get neither an OIDC token nor a writable GITHUB_TOKEN, so skip them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
      id-token: write
    # PR runs get an OIDC token with sub "repo:<owner>/<repo>:pull_request"; the main rule only
    # accepts the main branch, so PRs have their own federation rule.
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_015WZVwYQvDcDCLi8sjsVAex
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Fetch GitHub OIDC token for Anthropic
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('ANTHROPIC_IDENTITY_TOKEN', token);

      - name: Generate preview release notes
        continue-on-error: true
        env:
          # Quoted: an unquoted " #" starts a YAML comment, which cut the value down to "PR"
          NEW_TAG: "PR #${{ github.event.pull_request.number }} (preview)"
          PREVIOUS_TAG: ${{ github.event.pull_request.base.sha }}
          OUTPUT_FILE: release-notes-preview.md
        run: pnpm run generate:release-notes

      - name: Post preview as PR comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## 🤖 AI-generated release notes preview"
            echo ""
            if [ -s release-notes-preview.md ]; then
              echo "_Preview of the release notes if this PR's changes were released. Generated by Claude Haiku 4.5 - not an actual release._"
              echo ""
              cat release-notes-preview.md
            else
              echo "_Could not generate a preview (the Anthropic token exchange or API call failed, or the output was truncated). The real release will fall back to GitHub's auto-generated notes._"
            fi
          } > pr-comment-body.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file pr-comment-body.md --edit-last --create-if-none

  calculate-version:
    name: Calculate Next Version
    runs-on: ubuntu-latest
    # Runs for everything that builds images: pushes to main/master (releases) and manual dispatches
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event_name == 'workflow_dispatch'
    outputs:
      # Release (yyyy.mm.n) on a push to main/master, branch build (yyyy-mm-<branch>-nn) otherwise
      new_tag: ${{ steps.versioner.outputs.new_tag || steps.branch_versioner.outputs.new_tag }}
      is_release: ${{ steps.versioner.outputs.new_tag != '' }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required to fetch all tags

      - name: Calculate new version tag
        if: github.event_name == 'push'
        id: versioner
        run: |
          # 1. Set the year.month prefix (e.g., 2025.10)
          YEAR_MONTH=$(date +'%Y.%m')
          echo "Current month prefix: $YEAR_MONTH"

          # 2. Fetch all tags from the remote
          git fetch --tags

          # 3. Find the latest tag for this month (e.g., 2025.10.3)
          # We use 'sort -V' to sort version numbers correctly (e.g., 10 > 2)
          LATEST_TAG=$(git tag -l "$YEAR_MONTH.*" | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found for $YEAR_MONTH. Starting at increment .1"
            VERSION_INC=1
          else
            echo "Found latest tag: $LATEST_TAG"
            # 4. Get the last part of the tag (the '3' in 2025.10.3)
            LATEST_INC=$(echo "$LATEST_TAG" | cut -d'.' -f3)
            VERSION_INC=$((LATEST_INC + 1))
            echo "Incrementing to .${VERSION_INC}"
          fi

          # 5. Set the new tag
          NEW_TAG="${YEAR_MONTH}.${VERSION_INC}"
          echo "New tag: $NEW_TAG"

          # 6. Set the output for other jobs
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      # Branch builds never become a release or 'latest'. Their dashed yyyy-mm-<branch>-nn tag
      # can't collide with a release tag (yyyy.mm.n). nn continues from the highest number
      # already published to Docker Hub for this month and branch, across all app images.
      - name: Calculate branch version tag
        if: github.event_name == 'workflow_dispatch' && inputs.docker_tag == ''
        id: branch_versioner
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Docker tags allow [A-Za-z0-9_.-]; lowercase and replace the rest (e.g. 'feature/x' -> 'feature-x')
          SAFE_BRANCH=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[-.]+//; s/-+$//' | cut -c1-100)
          PREFIX="$(date +'%Y-%m')-${SAFE_BRANCH}-"
          echo "Branch tag prefix: $PREFIX"

          LATEST_INC=0
          for APP in korfbal-stream-api korfbal-stream-kit; do
            # A repository without tags (or not created yet) counts as no tags
            TAGS=$(skopeo list-tags --creds "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" "docker://docker.io/$DOCKERHUB_USERNAME/$APP" 2>/dev/null | jq -r '.Tags[]' || true)
            for TAG in $TAGS; do
              case "$TAG" in "$PREFIX"*) ;; *) continue ;; esac
              INC="${TAG#"$PREFIX"}"
              # Only prefix + digits, so branch 'foo' doesn't count tags of branch 'foo-bar'
              [[ "$INC" =~ ^[0-9]+$ ]] || continue
              if [ "$((10#$INC))" -gt "$LATEST_INC" ]; then
                LATEST_INC=$((10#$INC))
              fi
            done
          done
          echo "Highest number already published: $LATEST_INC"

          NEW_TAG="${PREFIX}$(printf '%02d' $((LATEST_INC + 1)))"
          echo "New branch tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.app.sanitized }}, ${{ matrix.platform }})
    # Native runner per architecture instead of QEMU emulation - the arm64 leg
    # used to take 20-30 min under emulation, this builds it natively instead.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # This job only runs if the checks and the integration/e2e tests pass AND (it's a push to main/master OR manual dispatch)
    needs: [ci-checks, db-tests, calculate-version]
    if: |
      always() &&
      (needs.ci-checks.result == 'success' || needs.ci-checks.result == 'skipped') &&
      (needs.db-tests.result == 'success' || needs.db-tests.result == 'skipped') &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
        github.event_name == 'workflow_dispatch'
      )

    # One job per affected app, per architecture. Each pushes its image by digest only;
    # the merge job below combines both architectures' digests into one multi-arch tag.
    strategy:
      fail-fast: false # Don't cancel other jobs if one app/platform fails
      matrix:
        # Read the JSON array output from the ci-checks job, or build all apps for manual dispatch
        # Matrix vectors may never be empty, so fall back to a 'none' placeholder
        # when no apps are affected (e.g. a root-config-only change) - the actual
        # build/push step is skipped for that placeholder below.
        app: ${{ github.event_name == 'workflow_dispatch' && fromJson('[{"original":"korfbal-stream-api","sanitized":"korfbal-stream-api"},{"original":"korfbal-stream-kit","sanitized":"korfbal-stream-kit"}]') || (needs.ci-checks.outputs.affected_apps_json != '' && needs.ci-checks.outputs.affected_apps_json != '[]' && fromJson(needs.ci-checks.outputs.affected_apps_json)) || fromJson('[{"original":"none","sanitized":"none"}]') }}
        platform: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout
        if: matrix.app.original != 'none'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare platform tag
        if: matrix.app.original != 'none'
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        if: matrix.app.original != 'none'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: matrix.app.original != 'none'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Base images are Docker Hardened Images (dhi.io); pulling them needs the same Docker Hub account.
      - name: Login to Docker Hardened Images registry
        if: matrix.app.original != 'none'
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tag
        if: matrix.app.original != 'none'
        id: docker_tag
        run: |
          if [ -n "${{ inputs.docker_tag }}" ]; then
            TAG="${{ inputs.docker_tag }}"
          else
            TAG="${{ needs.calculate-version.outputs.new_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No Docker tag determined"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Only releases get a GitHub Release page; branch builds link to their commit instead
          if [ "${{ needs.calculate-version.outputs.is_release }}" = "true" ]; then
            echo "info_url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "info_url=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        if: matrix.app.original != 'none'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # We assume the Dockerfile is at 'apps/<app-name>/Dockerfile'
          # Use the 'original' name for the file path
          file: ./apps/${{ matrix.app.sanitized }}/Dockerfile

          # No tags here - push by digest only. The merge job combines the
          # per-platform digests into the final tagged multi-arch manifest.
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.sanitized }},push-by-digest=true,name-canonical=true,push=true

          # Use the 'original' name for the build-arg (if Dockerfile needs it)
          build-args: |
            APP_NAME=${{ matrix.app.original }}
            APP_VERSION=${{ steps.docker_tag.outputs.tag }}

          # Standard OCI labels, visible on the Docker Hub tag page - points at the
          # GitHub Release for this tag (the actual changelog), or the commit for a branch build.
          labels: |
            org.opencontainers.image.title=${{ matrix.app.sanitized }}
            org.opencontainers.image.version=${{ steps.docker_tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ steps.docker_tag.outputs.info_url }}
            org.opencontainers.image.description=${{ needs.calculate-version.outputs.is_release == 'true' && 'Release notes' || 'Branch build' }}: ${{ steps.docker_tag.outputs.info_url }}

          # Cache is per-platform now that each architecture builds in its own job
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.sanitized }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.sanitized }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        if: matrix.app.original != 'none'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: matrix.app.original != 'none'
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.app.sanitized }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & Push (${{ matrix.app.sanitized }})
    runs-on: ubuntu-latest
    needs: [ci-checks, calculate-version, build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
        github.event_name == 'workflow_dispatch'
      )
    strategy:
      fail-fast: false
      matrix:
        app: ${{ github.event_name == 'workflow_dispatch' && fromJson('[{"original":"korfbal-stream-api","sanitized":"korfbal-stream-api"},{"original":"korfbal-stream-kit","sanitized":"korfbal-stream-kit"}]') || (needs.ci-checks.outputs.affected_apps_json != '' && needs.ci-checks.outputs.affected_apps_json != '[]' && fromJson(needs.ci-checks.outputs.affected_apps_json)) || fromJson('[{"original":"none","sanitized":"none"}]') }}

    steps:
      - name: Login to Docker Hub
        if: matrix.app.original != 'none'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: matrix.app.original != 'none'
        uses: docker/setup-buildx-action@v4

      - name: Download digests
        if: matrix.app.original != 'none'
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app.sanitized }}-*
          merge-multiple: true

      - name: Determine Docker tag
        if: matrix.app.original != 'none'
        id: docker_tag
        run: |
          if [ -n "${{ inputs.docker_tag }}" ]; then
            TAG="${{ inputs.docker_tag }}"
          else
            TAG="${{ needs.calculate-version.outputs.new_tag }}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No Docker tag determined"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Only releases get a GitHub Release page; branch builds link to their commit instead
          if [ "${{ needs.calculate-version.outputs.is_release }}" = "true" ]; then
            echo "info_url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "info_url=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push multi-arch manifest
        if: matrix.app.original != 'none'
        working-directory: /tmp/digests
        run: |
          TAGS="-t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.sanitized }}:${{ steps.docker_tag.outputs.tag }}"
          # Only releases from main/master move 'latest'
          if [ "${{ needs.calculate-version.outputs.is_release }}" = "true" ]; then
            TAGS="$TAGS -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.sanitized }}:latest"
          fi
          docker buildx imagetools create $TAGS \
            $(printf '${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.sanitized }}@sha256:%s ' *)

      - name: Inspect image
        if: matrix.app.original != 'none'
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.sanitized }}:${{ steps.docker_tag.outputs.tag }}

      # The Docker Hub overview belongs to the repository, not a tag: only releases update it,
      # so a branch build can't overwrite it. Needs a personal access token with the 'Read, Write, Delete'
      # scope: DOCKERHUB_DESCRIPTION_TOKEN, so the push token can keep fewer rights (falls back to DOCKERHUB_TOKEN).
      - name: Checkout Docker Hub description
        if: matrix.app.original != 'none' && needs.calculate-version.outputs.is_release == 'true'
        uses: actions/checkout@v5
        with:
          sparse-checkout: apps/${{ matrix.app.sanitized }}/DOCKERHUB.md
          sparse-checkout-cone-mode: false

      - name: Update Docker Hub description
        if: matrix.app.original != 'none' && needs.calculate-version.outputs.is_release == 'true'
        # The image is already pushed: a failing description must not fail the job, or create-git-tag is
        # skipped and the next build reuses (and overwrites) this version
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.app.sanitized }}
          readme-filepath: apps/${{ matrix.app.sanitized }}/DOCKERHUB.md
          short-description: ${{ matrix.app.sanitized == 'korfbal-stream-api' && 'Korfbal StreamKit API – producties, callsheets, live show control en vMix-databronnen' || 'Korfbal StreamKit webapp – LIVE callsheet en Show Caller, plus Beheer voor producties' }}

  create-git-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    # This job runs after all builds are successful, only for automatic releases (not manual dispatch)
    needs: [calculate-version, merge]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine previous tag
        id: prev
        env:
          NEW_TAG: ${{ needs.calculate-version.outputs.new_tag }}
        run: |
          # Exclude the new tag itself, so a re-run (tag already pushed) still finds the real previous one
          PREVIOUS_TAG=$(git tag -l "20*.*.*" | grep -vxF "$NEW_TAG" | sort -V | tail -n 1 || true)
          echo "Previous tag: ${PREVIOUS_TAG:-<none>}"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      # Everything up to and including the notes is best-effort: a failure here must
      # never keep the tag or the GitHub Release (linked from the image labels) from being created.
      - name: Install pnpm
        continue-on-error: true
        uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true

      - name: Setup Node.js
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        continue-on-error: true
        run: pnpm install

      - name: Fetch GitHub OIDC token for Anthropic
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('ANTHROPIC_IDENTITY_TOKEN', token);

      - name: Generate AI release notes
        # If this fails, the release below falls back to `gh release create --generate-notes`.
        continue-on-error: true
        env:
          NEW_TAG: ${{ needs.calculate-version.outputs.new_tag }}
          PREVIOUS_TAG: ${{ steps.prev.outputs.previous_tag }}
          OUTPUT_FILE: release-notes.md
        run: pnpm run generate:release-notes

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ needs.calculate-version.outputs.new_tag }}
          PREVIOUS_TAG: ${{ steps.prev.outputs.previous_tag }}
        run: |
          # Idempotent, so the job can be re-run after a later step failed
          if git ls-remote --exit-code --tags origin "refs/tags/$NEW_TAG" >/dev/null; then
            echo "Tag $NEW_TAG already exists on origin - skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generate commit summary since previous tag
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMIT_SUMMARY=$(git log --pretty=format:"- %s" --no-merges)
          else
            COMMIT_SUMMARY=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          fi

          # Create tag message with commit summary
          TAG_MESSAGE="Release ${NEW_TAG}

          Changes since ${PREVIOUS_TAG:-initial commit}:
          ${COMMIT_SUMMARY}"

          git tag -a "$NEW_TAG" -m "$TAG_MESSAGE"
          git push origin "$NEW_TAG"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ needs.calculate-version.outputs.new_tag }}
        run: |
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "Release $NEW_TAG already exists - skipping"
            exit 0
          fi
          if [ -s release-notes.md ]; then
            echo "Using AI-generated release notes"
            gh release create "$NEW_TAG" --title "$NEW_TAG" --notes-file release-notes.md
          else
            echo "No AI-generated release notes - falling back to auto-generated notes"
            gh release create "$NEW_TAG" --title "$NEW_TAG" --generate-notes
          fi
