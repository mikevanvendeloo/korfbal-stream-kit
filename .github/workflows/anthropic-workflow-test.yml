name: anthropic-wif-test
# Manual smoke test for the Workload Identity Federation setup (see ci.yml env).
# Run it from the Actions tab after changing the federation rule or service account.
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_012qG62fm1N1C3HwGuAnGBxN",
            "organization_id": "fe21c84c-124f-436b-b4fb-06e6c829f7a4",
            "service_account_id": "svac_01EKysMoY7N4pk1zP24TZhNL",
            "workspace_id": "wrkspc_01UNAAN2mqSkjkz1kPRfqC7f"
          }
          JSON
