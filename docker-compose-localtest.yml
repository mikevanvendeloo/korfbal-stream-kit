# Lokale testomgeving: de lokaal gebouwde (hardened) images tegen een database die bij de eerste
# start automatisch uit een SQL-backup (pg_dump) wordt gevuld. Staat los van de dev-stack (eigen projectnaam en
# volumes), maar gebruikt dezelfde poorten 80 en 5050 als docker-compose.yml: draai ze nooit tegelijk. De
# dev-database voor npm run dev (docker-compose-db.yml, 5432) kan er wel naast draaien.
#
#   Starten (bouwt de images):   docker compose -f docker-compose-localtest.yml up -d --build
#   Terug naar het startpunt:    docker compose -f docker-compose-localtest.yml down -v
#                                docker compose -f docker-compose-localtest.yml up -d
#   Andere backup:               LOCALTEST_SQL=/pad/naar/dump.sql docker compose -f docker-compose-localtest.yml up -d
#   Andere afbeeldingenmap:      LOCALTEST_STORAGE=/pad/naar/storage docker compose -f docker-compose-localtest.yml up -d
#
# Frontend: http://localhost   API: http://localhost:3334   Postgres: localhost:5433 (fortuna/streamz)
# pgadmin:  http://localhost:5050   Grafana: http://localhost:3000
# `down -v` wist alleen de database van deze testomgeving. Afbeeldingen (spelers, sponsors, clubs) staan op je
# eigen schijf in ./storage, dus die blijven bij down/up en stroomuitval gewoon staan.
name: korfbal-localtest

# Docker keeps the console log of a container in a file; without a limit it grows until the disk is full
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  streamz-db:
    image: postgres:16-alpine
    networks:
      - korfbal-network
    environment:
      TZ: Europe/Amsterdam
      # De dump is gemaakt door gebruiker 'fortuna'; met dezelfde naam kloppen de OWNER-regels.
      POSTGRES_USER: fortuna
      # Alleen voor deze wegwerp-testdatabase; overschrijfbaar via LOCALTEST_DB_PASSWORD.
      POSTGRES_PASSWORD: ${LOCALTEST_DB_PASSWORD:-localtest}
      POSTGRES_DB: streamz
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Wordt alleen ingelezen als het db-volume nog leeg is (eerste start of na `down -v`).
      - ${LOCALTEST_SQL:-../2025-2026-backup/streamz-2025.sql}:/docker-entrypoint-initdb.d/10-restore.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortuna -d streamz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    # --- Geheugenlimiet ---
    mem_limit: 1024m
    memswap_limit: 1024m

  # Draait de migraties die nog niet in de backup zaten (bijv. seizoenen). Geen seed: die zou de
  # herstelde personen/sponsors/templates bijwerken.
  migrate-streamz:
    build:
      context: .
      dockerfile: apps/korfbal-stream-api/Dockerfile
    image: korfbal-stream-api:localtest
    networks:
      - korfbal-network
    depends_on:
      streamz-db:
        condition: service_healthy
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      SKIP_SEED: "true"
      DATABASE_URL: postgresql://fortuna:${LOCALTEST_DB_PASSWORD:-localtest}@streamz-db:5432/streamz?schema=public
    command: ["node", "--max-old-space-size=384", "/app/seed/migrate-and-seed.cjs"]
    restart: "no"
    # --- Geheugenlimiet ---
    mem_limit: 512m
    memswap_limit: 512m

  # De servicenaam moet korfbal-streamz-api blijven: nginx.conf proxyt daarnaartoe.
  korfbal-streamz-api:
    image: korfbal-stream-api:localtest
    logging: *logging
    networks:
      - korfbal-network
    # Optioneel: lokale secrets uit je niet-ingecheckte secrets.env
    env_file:
      - path: secrets.env
        required: false
    environment:
      TZ: Europe/Amsterdam
      NODE_ENV: production
      DATABASE_URL: postgresql://fortuna:${LOCALTEST_DB_PASSWORD:-localtest}@streamz-db:5432/streamz?schema=public
      PORT: 3333
      # true: also log every successful GET (vMix, scoreboard) and what the vMix data sources return
      DEBUG_LOGGING: ${DEBUG_LOGGING:-false}
      ASSETS_DIR: /app/storage
    depends_on:
      streamz-db:
        condition: service_healthy
      migrate-streamz:
        condition: service_completed_successfully
    ports:
      - "3334:3333"
    volumes:
      # Bind-mount naar je eigen schijf; de API (uid 1000) moet erin kunnen schrijven. Op macOS regelt
      # Docker Desktop dat; op Linux eenmalig: sudo chown -R 1000:1000 storage
      - ${LOCALTEST_STORAGE:-./storage}:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    # --- Geheugenlimiet ---
    mem_limit: 1024m
    memswap_limit: 1024m
    # V8-heap mag niet groter dan de container-limiet minus ~256 MB (libuv, request buffers)
    command: ["node", "--max-old-space-size=768", "/app/main.js"]

  korfbal-streamz-kit:
    build:
      context: .
      dockerfile: apps/korfbal-stream-kit/Dockerfile
    image: korfbal-stream-kit:localtest
    logging: *logging
    networks:
      - korfbal-network
    ports:
      - "80:8080"
    environment:
      TZ: Europe/Amsterdam
    depends_on:
      - korfbal-streamz-api
    # --- Geheugenlimiet ---
    mem_limit: 256m
    memswap_limit: 256m

  # --- pgAdmin (optioneel, handig voor lokale inspectie) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: korfbal-pgadmin-localtest
    networks:
      - korfbal-network
    environment:
      TZ: Europe/Amsterdam
      PGADMIN_DEFAULT_EMAIL: admin@korfbal.nl
      PGADMIN_DEFAULT_PASSWORD: ${LOCALTEST_PGADMIN_PASSWORD:-korfbal}
      # Toont de lokale DB als favoriet bij opstart
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./servers-localtest.json:/pgadmin4/servers.json
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - streamz-db
    # --- Geheugenlimiet (pgAdmin4 is relatief zwaar door Chromium renderer) ---
    mem_limit: 512m
    memswap_limit: 512m

volumes:
  db-data:
  pgadmin-data:

networks:
  korfbal-network:
    # Vaste naam: docker-compose-monitoring.yml koppelt hieraan (external). Start localtest dus vóór monitoring,
    # en stop monitoring vóór `down` van localtest (anders: "network has active endpoints").
    name: korfbal-network
    driver: bridge
